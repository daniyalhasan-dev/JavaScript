<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // continue statement
        for(let a =1; a<=10; a++){
            if( a==3 ){
                document.write('HEY: ' + a + '<br>');
                continue;
            }
            document.write('Number:' + a +'<br>')
        }

        document.write('<br>')

        // break statement
        for(let a =1; a<=10; a++){
            if( a==3 ){
                document.write('HEY: ' + a + '<br>');
                break;
            }
            document.write('Number:' + a +'<br>')
        }
    </script>
</head>
<body>
    
</body>
</html>
