<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        // global variable

        var a = 'hello';

        function world (){
            document.write(a + " ")
        }
        world();
        document.write(a);

        // local variable

        function Daniyal (){
            var b = 26;
            document.write( " " + b )
        }
        Daniyal();
        document.write(b);

    </script>
</head>
