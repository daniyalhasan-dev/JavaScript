<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function Js(){
            document.write('Hello Everyone')
        }
    </script>
</head>
<body>
    <button onclick="Js()">Click Me</button>
    <br>
    <button oncontextmenu="Js()">Click Me</button>
    <br>
    <button ondblclick="Js()">Click Me</button>
    <br>
    <button onmouseenter="Js()">Click Me</button>
    <br>
    <button onmouseout="Js()">Click Me</button>
    <br>
    <button onmousedown="Js()">Click Me</button>
</body>
</html>
