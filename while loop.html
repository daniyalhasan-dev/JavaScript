<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style-type: none;
            padding-left: 0;
        }
    </style>
    <script>
        let a = 1;
        while(a<=10){
            document.write('Hello World<br>');
            a = a+1;
        }


        document.write('<br>')



        // while loop in html tag
        let b = 1;
        while(b<=10){
            document.write('<li>' + 'Hello World' + '</li>');
            b = b+1;
        }

        document.write('<br>')


        // if I want to add counting 
        let c = 1;
        document.write('<ul>');
        while(c<=10){
            document.write('<li>' + c + ') Hello World' + '</li>');
            c = c+1;
        }

        document.write('</ul>');



    </script>
</head>
<body>
    
</body>
</html>
